name: Build and publish Carewright Operator image

on:
  push:
    branches: [main]
    paths:
      - 'carewright-operator/**'
      - '.github/workflows/publish-operator-image.yml'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to build (mutually exclusive with branch)
        required: false
        type: number
      branch:
        description: Branch name to build (mutually exclusive with pr_number)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-operator-image-${{ github.ref }}-${{ inputs.pr_number }}-${{ inputs.branch }}
  cancel-in-progress: false

env:
  QUAY_NAMESPACE: ${{ vars.QUAY_NAMESPACE || 'carewright' }}

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      checkout_ref: ${{ steps.source.outputs.checkout_ref }}
    steps:
      - name: Validate and resolve image source
        id: source
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          BRANCH_NAME: ${{ inputs.branch }}
        run: |
          if [[ -n "$PR_NUMBER" && -n "$BRANCH_NAME" ]]; then
            echo "::error title=Invalid image source::Provide either pr_number or branch, not both."
            exit 1
          fi

          if [[ -n "$PR_NUMBER" ]]; then
            checkout_ref="refs/pull/$PR_NUMBER/head"
          elif [[ -n "$BRANCH_NAME" ]]; then
            checkout_ref="refs/heads/$BRANCH_NAME"
          else
            checkout_ref="$GITHUB_REF"
          fi

          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.source.outputs.checkout_ref }}

      - id: tag
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          BRANCH_NAME: ${{ inputs.branch }}
        run: |
          sha="$(git rev-parse --short HEAD)"

          if [[ -n "$PR_NUMBER" ]]; then
            value="pr-$PR_NUMBER-$sha"
          elif [[ -n "$BRANCH_NAME" ]]; then
            branch_slug="$(printf '%s' "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g; s#^-+##; s#-+$##')"
            branch_slug="${branch_slug:0:80}"
            value="branch-${branch_slug:-head}-$sha"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            value="$sha"
          else
            branch_slug="$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g; s#^-+##; s#-+$##')"
            branch_slug="${branch_slug:0:80}"
            value="branch-${branch_slug:-head}-$sha"
          fi

          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "revision=$sha" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: carewright-operator
          file: carewright-operator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: quay.io/${{ env.QUAY_NAMESPACE }}/carewright-operator:${{ steps.tag.outputs.value }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.tag.outputs.revision }}
          cache-from: type=gha,scope=carewright-operator
          cache-to: type=gha,mode=min,scope=carewright-operator

      - name: Update latest tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            --tag quay.io/${{ env.QUAY_NAMESPACE }}/carewright-operator:latest \
            quay.io/${{ env.QUAY_NAMESPACE }}/carewright-operator:${{ steps.tag.outputs.value }}
