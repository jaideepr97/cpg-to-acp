image:
  registry: image-registry.openshift-image-registry.svc:5000
  # Namespace is overridden by deploy scripts (--set image.namespace=...)
  namespace: default

# When true, sandboxed pods render no Deployment (OpenShell sandboxes replace
# them) and their Services select the openshell-router instead of pod labels.
openshellMode: true

pods:
  patient-data:
    enabled: true
    sandboxed: true
    image: acp-writer-patient-data
    tag: latest
    port: 8080
    secrets:
      minio: true
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi

  llm-reasoning:
    enabled: true
    sandboxed: true
    image: acp-writer-llm
    tag: latest
    port: 8080
    env:
      litellmUrl: http://localhost:4000
      llmModel: default
      decisionEngineUrl: http://acp-decision-engine:8080
    secrets:
      llm: true
      minio: true
    resources:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi

  decision-engine:
    enabled: true
    sandboxed: true
    image: acp-writer-decision
    tag: latest
    port: 8080
    env:
      kogitoUrl: http://cpg-decision-svc-decision-service:8081
    secrets:
      minio: true
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi

  fhir-generation:
    enabled: true
    sandboxed: true
    image: acp-writer-fhir-gen
    tag: latest
    port: 8080
    env:
      litellmUrl: http://localhost:4000
      llmModel: default
    secrets:
      llm: true
      minio: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  fhir-server:
    enabled: true
    sandboxed: true
    image: acp-writer-fhir-srv
    tag: latest
    port: 8080
    env:
      fhirServerUrl: http://cpg-mock-ehr-medplum-server:8103/fhir/R4
    secrets:
      minio: true
      fhir: true
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi

  bff:
    enabled: true
    sandboxed: false
    image: acp-writer-bff
    tag: latest
    port: 8080
    env:
      sonataflowUrl: http://acpwriter:80
      minioEndpoint: http://minio:9000
      llmReasoningUrl: http://acp-llm-reasoning:8080
      decisionEngineUrl: http://acp-decision-engine:8080
      fhirServerUrl: http://acp-fhir-server:8080
    secrets:
      minio: true
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi

  ui:
    enabled: true
    sandboxed: false
    image: acp-writer-ui
    tag: latest
    port: 8080
    env:
      bffHost: acp-bff:8080
    route: true
    volumes:
      - name: smart-credentials
        secretName: smart-client-credentials
        mountPath: /opt/app-root/src/smart-config.json
        subPath: smart-config.json
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

mlflow:
  # Overridden by deploy scripts from cluster.env MLFLOW_TRACKING_URI
  trackingUri: ""
