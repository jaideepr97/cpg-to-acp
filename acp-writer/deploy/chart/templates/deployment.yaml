apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-acp-writer
  labels:
    app.kubernetes.io/name: acp-writer
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: care-plan-writer
    app.kubernetes.io/part-of: cpg-to-acp
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: acp-writer
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: acp-writer
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: care-plan-writer
        app.kubernetes.io/part-of: cpg-to-acp
    spec:
      containers:
        - name: acp-writer
          image: "{{ .Values.image.registry }}/{{ .Values.image.namespace }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: KOGITO_URL
              value: {{ .Values.decisionService.url | quote }}
            - name: MLFLOW_TRACKING_URI
              value: {{ .Values.mlflow.trackingUri | quote }}
            {{- with .Values.aiTransparency }}
            {{- if hasKey . "capturePrompts" }}
            - name: ACP_CAPTURE_PROMPTS
              value: {{ .capturePrompts | quote }}
            {{- end }}
            {{- if .modelCardUrl }}
            - name: LLM_MODEL_CARD_URL
              value: {{ .modelCardUrl | quote }}
            {{- end }}
            {{- if .reviewerDisplay }}
            - name: ACP_REVIEWER_DISPLAY
              value: {{ .reviewerDisplay | quote }}
            {{- end }}
            {{- if .reviewerReference }}
            - name: ACP_REVIEWER_REFERENCE
              value: {{ .reviewerReference | quote }}
            {{- end }}
            {{- if .reviewerIdSystem }}
            - name: ACP_REVIEWER_ID_SYSTEM
              value: {{ .reviewerIdSystem | quote }}
            {{- end }}
            {{- if .reviewerIdValue }}
            - name: ACP_REVIEWER_ID_VALUE
              value: {{ .reviewerIdValue | quote }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
