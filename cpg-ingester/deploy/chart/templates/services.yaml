{{- range $name, $pod := .Values.pods }}
{{- if $pod.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    app.kubernetes.io/name: cpg-ingester-{{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: cpg-to-acp
spec:
  {{- if and $.Values.openshellMode $pod.sandboxed }}
  selector:
    app: openshell-router
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  {{- else }}
  selector:
    app.kubernetes.io/name: cpg-ingester-{{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    - port: {{ $pod.port }}
      targetPort: {{ $pod.port }}
      protocol: TCP
  {{- end }}
{{- end }}
{{- end }}
