image:
  registry: image-registry.openshift-image-registry.svc:5000
  # Namespace is overridden by deploy scripts (--set image.namespace=...)
  namespace: default

pods:
  ingestion:
    enabled: true
    image: cpg-ingester-ingestion
    tag: latest
    port: 8080
    secrets:
      minio: true
    resources:
      # Docling models loaded at runtime — OOMs below 3Gi (deployment-log evidence)
      requests:
        cpu: 500m
        memory: 3Gi
      limits:
        cpu: "2"
        memory: 4Gi

  llm-analysis:
    enabled: true
    image: cpg-ingester-llm
    tag: latest
    port: 8080
    env:
      # Bare origin — get_llm() appends /v1. Deploy scripts override this.
      litellmUrl: http://localhost:4000
      llmModel: default
    secrets:
      llm: true
      minio: true
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi

  assembly:
    enabled: true
    image: cpg-ingester-assembly
    tag: latest
    port: 8080
    secrets:
      minio: true
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi

  delivery:
    enabled: true
    image: cpg-ingester-delivery
    tag: latest
    port: 8080
    env:
      # Delivery deploys DMN models via POST /api/v1/decisions/models.
      # In pods+OpenShell mode, this endpoint is on the decision-engine service
      # (routed through openshell-router to sb-decision-engine).
      acpWriterUrl: http://acp-decision-engine:8080
    secrets:
      minio: true
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi

  bff:
    enabled: true
    image: cpg-ingester-bff
    tag: latest
    port: 8080
    secrets:
      minio: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  ui:
    enabled: true
    image: cpg-ingester-ui
    tag: latest
    port: 8080
    route: true
    env:
      bffHost: cpg-ingester-bff:8080
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

mlflow:
  # Overridden by deploy scripts from cluster.env MLFLOW_TRACKING_URI
  trackingUri: ""
