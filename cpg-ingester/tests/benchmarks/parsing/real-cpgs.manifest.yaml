    source_url: "https://www.nhlbi.nih.gov/files/docs/guidelines/asthma_qrg.pdf"
    archetype_tag: flowchart-heavy
    license_note: "U.S. federal government work (NIH/NHLBI); public domain (17 USC 105)."
    sha256: TBD

