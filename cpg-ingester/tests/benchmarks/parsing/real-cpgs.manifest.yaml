    source_url: "https://www.cdc.gov/mmwr/volumes/70/rr/pdfs/rr7004a1-H.pdf"
    archetype_tag: table-heavy
    license_note: "U.S. federal government work (CDC/MMWR); public domain (17 USC 105)."
    sha256: TBD

