# acp-writer FHIR Server pod: HAPI FHIR server only
version: 1

filesystem_policy:
  read_only: [/usr, /lib, /lib64, /etc, /opt, /bin, /sbin]
  read_write: [/sandbox, /tmp, /app, /dev, /run, /var, /home]

network_policies:
  gateway:
    name: openshell-gateway
    endpoints:
      - host: "**.svc.cluster.local"
        port: 8080
        enforcement: log
        allowed_ips:
          - "172.30.0.0/16"
          - "10.128.0.0/14"
    binaries:
      - path: "**"
  mlflow:
    name: mlflow-tracing
    endpoints:
      - host: "mlflow-redhat-ods-applications.apps.rosa.agentic-mcp.jolf.p3.openshiftapps.com"
        port: 443
        enforcement: enforce
    binaries:
      - path: "**"
  fhir_server:
    name: hapi-fhir
    endpoints:
      - host: "**.svc.cluster.local"
        port: 8080
        enforcement: enforce
        allowed_ips:
          - "172.30.0.0/16"
          - "10.128.0.0/14"
    binaries:
      - path: "**"
  minio:
    name: artifact-store
    endpoints:
      - host: "minio"
        port: 9000
        enforcement: enforce
        allowed_ips:
          - "172.30.0.0/16"
          - "10.128.0.0/14"
      - host: "minio.sschifma-cpg-to-acp.svc.cluster.local"
        port: 9000
        enforcement: enforce
        allowed_ips:
          - "172.30.0.0/16"
          - "10.128.0.0/14"
    binaries:
      - path: "**"
