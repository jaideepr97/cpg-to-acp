# acp-writer Patient Data pod: artifact store (PHI bucket) only
version: 1

filesystem_policy:
  read_only: [/usr, /lib, /lib64, /etc, /opt, /bin, /sbin]
  read_write: [/sandbox, /tmp, /app, /dev, /run, /var, /home]

network_policies:
  gateway:
    name: openshell-gateway
    endpoints:
      - host: "**.svc.cluster.local"
        port: 8080
        enforcement: log
        access: full
    binaries:
      - path: "**"
  mlflow:
    name: mlflow-tracing
    endpoints:
      - host: "mlflow-redhat-ods-applications.apps.rosa.agentic-mcp.jolf.p3.openshiftapps.com"
        port: 443
        enforcement: enforce
        access: full
    binaries:
      - path: "**"
  minio:
    name: artifact-store
    endpoints:
      - host: "minio.sschifma-cpg-to-acp.svc.cluster.local"
        port: 9000
        enforcement: enforce
        access: full
    binaries:
      - path: "**"
