---
apiVersion: v1
kind: Service
metadata:
  name: openshell-http
  labels:
    app.kubernetes.io/name: openshell-http
spec:
  selector:
    app.kubernetes.io/name: openshell
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshell-router
  labels:
    app: openshell-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openshell-router
  template:
    metadata:
      labels:
        app: openshell-router
    spec:
      containers:
        - name: nginx
          image: registry.access.redhat.com/ubi9/nginx-124:latest
          command: ["nginx", "-g", "daemon off;", "-c", "/etc/nginx/nginx-custom.conf"]
          ports:
            - containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx-custom.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-config
          configMap:
            name: openshell-router-config
