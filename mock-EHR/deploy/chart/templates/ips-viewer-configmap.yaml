apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-ips-viewer-config
  labels:
    app.kubernetes.io/name: ips-viewer
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: smart-app
    app.kubernetes.io/part-of: cpg-to-acp
  annotations:
    helm.sh/hook-weight: "-1"
data:
  smart-config.json: |
    {
      "clientId": "{{ .Values.ipsViewer.smartClientId | default "" }}",
      "clientSecret": "{{ .Values.ipsViewer.smartClientSecret | default "" }}"
    }
