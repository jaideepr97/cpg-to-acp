apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ips-viewer
  labels:
    app.kubernetes.io/name: ips-viewer
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: smart-app
    app.kubernetes.io/part-of: cpg-to-acp
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.ipsViewer.service.port }}
      targetPort: {{ .Values.ipsViewer.port }}
      name: http
  selector:
    app.kubernetes.io/name: ips-viewer
    app.kubernetes.io/instance: {{ .Release.Name }}
