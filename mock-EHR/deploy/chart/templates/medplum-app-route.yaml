apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Release.Name }}-medplum-app
  labels:
    app.kubernetes.io/name: medplum-app
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: oauth-ui
    app.kubernetes.io/part-of: cpg-to-acp
spec:
  to:
    kind: Service
    name: {{ .Release.Name }}-medplum-app
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
