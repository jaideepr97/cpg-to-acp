apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-medplum-server
  labels:
    app.kubernetes.io/name: medplum-server
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: fhir-server
    app.kubernetes.io/part-of: cpg-to-acp
spec:
  replicas: {{ .Values.medplumServer.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: medplum-server
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: medplum-server
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: fhir-server
        app.kubernetes.io/part-of: cpg-to-acp
    spec:
      containers:
        - name: medplum-server
          image: {{ .Values.medplumServer.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.medplumServer.port }}
          resources:
            {{- toYaml .Values.medplumServer.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: {{ .Values.medplumServer.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: {{ .Values.medplumServer.port }}
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /usr/src/medplum/medplum.config.json
              subPath: medplum.config.json
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-medplum-server-config
