apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Release.Name }}-medplum-server
  labels:
    app.kubernetes.io/name: medplum-server
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: fhir-server
    app.kubernetes.io/part-of: cpg-to-acp
  annotations:
    haproxy.openshift.io/timeout: 3m
spec:
  to:
    kind: Service
    name: {{ .Release.Name }}-medplum-server
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
