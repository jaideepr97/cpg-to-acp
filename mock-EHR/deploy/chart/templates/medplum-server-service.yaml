apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-medplum-server
  labels:
    app.kubernetes.io/name: medplum-server
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: fhir-server
    app.kubernetes.io/part-of: cpg-to-acp
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.medplumServer.service.port }}
      targetPort: {{ .Values.medplumServer.port }}
      name: http
  selector:
    app.kubernetes.io/name: medplum-server
    app.kubernetes.io/instance: {{ .Release.Name }}
