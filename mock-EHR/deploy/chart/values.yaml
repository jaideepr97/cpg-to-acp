image:
  registry: image-registry.openshift-image-registry.svc:5000
  namespace: sschifma-cpg-to-acp

postgres:
  image: image-registry.openshift-image-registry.svc:5000/sschifma-cpg-to-acp/postgres-16:16
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  storage:
    size: 5Gi
    storageClass: gp3-csi
  service:
    port: 5432

redis:
  image: image-registry.openshift-image-registry.svc:5000/sschifma-cpg-to-acp/redis-7:7
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  service:
    port: 6379

medplumServer:
  image: image-registry.openshift-image-registry.svc:5000/sschifma-cpg-to-acp/medplum-server-upstream:5.1.27
  replicas: 1
  port: 8103
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  baseUrl: ""
  appBaseUrl: ""
  service:
    port: 8103

medplumApp:
  image: image-registry.openshift-image-registry.svc:5000/sschifma-cpg-to-acp/medplum-app-upstream:5.1.27
  replicas: 1
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  service:
    port: 3000

mockEhrApp:
  image:
    name: mock-ehr-app
    tag: phase4
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  service:
    port: 8080
  route:
    enabled: true

ipsViewer:
  image:
    name: ips-viewer
    tag: phase4
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  service:
    port: 8080

loader:
  image:
    name: medplum-loader
    tag: phase4
