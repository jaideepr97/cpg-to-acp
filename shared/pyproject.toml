[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpg-contracts"
version = "0.1.2"
description = "Shared contract types for CPG-to-ACP components"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.0",
    "requests>=2.28",
]

[project.optional-dependencies]
s3 = ["boto3>=1.28"]
llm = ["langchain-openai>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]
